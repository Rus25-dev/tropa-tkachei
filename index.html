<meta name="description" content="Тропа Ткачей — кооперативная метроидвания в браузере. Вдвоём за одним компьютером или по сети.">
<meta name="theme-color" content="#070d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Тропа Ткачей</title>
<style>
  :root { --void: #070d0c; --bone: #e8e2cf; --moss: #67ad62; --muted: #7fa596; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--bone); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; font-family: "Fira Sans", system-ui, sans-serif; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #ui > * { pointer-events: auto; }
</style>

<div id="game"></div>
<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
