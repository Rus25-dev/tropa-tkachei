name: CI

# Проверяем локально; GitHub не повторяет проверки после push/PR.
# При необходимости весь набор можно запустить вручную: Actions → CI → Run workflow.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Набор проверок'
        type: choice
        options: [quick, full]
        default: quick

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # линт, типы, быстрые тесты Vitest (test:fast), сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - if: inputs.suite != 'full'
        run: npm run test:fast
      - if: inputs.suite == 'full'
        run: npm test -- --maxWorkers=2
      - run: npm run content:check
      - run: npm run boss:check
      - run: npm run build

  e2e:
    # дымовой тест: игра стартует в настоящем Chromium. Полный набор — npm run test:e2e на локальном стенде или вручную
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - if: inputs.suite != 'full'
        run: npm run test:smoke
      - if: inputs.suite == 'full'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  fuzz:
    # фаззер ядра: все режимы, инварианты, сверка «журнал → воспроизведение»; находки сохраняются минимальными записями в tests/repro
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fuzz -- --seconds 30 --seed ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-repro
          path: tests/repro
          retention-days: 14

  legacy-golden:
    # золотые записи v1.8 на старой игре: не зависят от текущих правок; по запросу вручную
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix legacy ci
      - name: Золотые записи v1.8 на старой игре
        run: |
          export CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm --prefix legacy run golden

  legacy-full:
    # полный набор тестов старой игры v1.8 (UI, сеть, меню): только по запросу вручную; на медленном CI страница старой игры иногда не успевает загрузиться
    if: inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --prefix legacy ci
      - run: |
          export CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm --prefix legacy run test:full
